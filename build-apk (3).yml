      - name: Crear proyecto Capacitor
        run: |
          rm -rf android node_modules package.json package-lock.json
          echo '{"name":"guardia-unne","version":"1.0.0","private":true}' > package.json
          npm install --legacy-peer-deps \
            @capacitor/core@${CAP_VERSION} \
            @capacitor/cli@${CAP_VERSION} \
            @capacitor/android@${CAP_VERSION} \
            @capacitor/filesystem@${CAP_VERSION} \
            @capacitor/geolocation@${CAP_VERSION} \
            capacitor-native-biometric@4.2.2
          cat > capacitor.config.json <<JSON
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android

      - name: Permisos de Android
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = [
            'android.permission.USE_BIOMETRIC',
            'android.permission.VIBRATE',
            'android.permission.CAMERA',
            'android.permission.RECORD_AUDIO',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
          ]
          add = ['<uses-permission android:name="%s" />' % x for x in perms if x not in s]
          if 'WRITE_EXTERNAL_STORAGE' not in s:
              add.append('<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />')
          if 'READ_EXTERNAL_STORAGE' not in s:
              add.append('<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />')
          s = s.replace('<application', '\n    '.join(add) + '\n\n    <application', 1)
          if 'requestLegacyExternalStorage' not in s:
              s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Manifest actualizado')
          PY
          npx cap sync android

      - name: Compilar APK de prueba (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Guardia-UNNE-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Compilar y firmar APK (solo si cargaste los secretos)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=app/build/outputs/apk/release
          "$BT/zipalign" -f -p 4 "$OUT/app-release-unsigned.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \
            --out "$OUT/Guardia-UNNE-release.apk" "$OUT/aligned.apk"

      - name: Guardar el APK firmado
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Guardia-UNNE-release
          path: android/app/build/outputs/apk/release/Guardia-UNNE-release.apk
          retention-days: 90
