# =====================================================================
#  GUARDIA UNNE - BUILD TODO EN UNO (GitHub Actions)
#  La app (index.html) va embebida en este archivo.
#
#  USO
#  1) Subir este archivo a:  .github/workflows/build-apk.yml   (con el punto)
#     en la rama principal (main).
#  2) Actions > "Build APK Guardia UNNE" > Run workflow.
#  3) Bajar el APK desde la ejecucion > Artifacts.
#  Opcional: si subis index.html a la raiz del repo, se usa ese en lugar del embebido.
#  APK firmado (opcional): secretos KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#  KEY_ALIAS, KEY_PASSWORD.
# =====================================================================
name: Build APK Guardia UNNE

on:
  workflow_dispatch:

env:
  APP_ID: ar.edu.unne.guardia
  APP_NAME: Guardia UNNE
  CAP_VERSION: "6"
  APP_SHA256: 87392d7e348b3ed082487fb2686586366aa64e996091bec433e31af75ede72ab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar la app
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            echo "Usando index.html del repositorio"
            cp index.html www/index.html
